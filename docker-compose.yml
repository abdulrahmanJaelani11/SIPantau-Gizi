version: '3.8'

services:
  app:
    build: .
    container_name: sipantau_app
    ports:
      - "8080:80"
    volumes:
      # Mount folder project ke /var/www/html/sipantau-gizi
      - .:/var/www/html/sipantau-gizi
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=db_sipantau_gizi
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sipantau_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_sipantau_gizi
    volumes:
      - sipantau_data:/var/lib/mysql
      # Otomatis import database saat container pertama kali dibuat
      - ./database/db_sipantau_gizi.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  sipantau_data:
